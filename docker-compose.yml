name: cyberlounge

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_DEBUG=False
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  bot:
    build:
      context: ./tg_bot
      dockerfile: Dockerfile
    command: sh -c "sleep 8 && node index.js"
    volumes:
      - ./tg_bot:/app
      - /app/node_modules
    env_file:
      - ./tg_bot/.env
    environment:
      - API_BASE_URL=http://backend:8000/api
    depends_on:
      backend:
        condition: service_healthy
